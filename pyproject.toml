[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gwix-synthetic-lab"
version = "1.2.0"
description = "Reproducible synthetic fiscal-household-macro laboratory"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
png = ["Pillow==12.2.0"]
pdf = ["Pillow==12.2.0", "reportlab==4.5.0"]

[tool.setuptools]
packages = ["gwix"]
